name: Add BURGRS system admin profile

on:
  push:
    paths:
      - scripts/add-system-admin-profile.py
      - .github/workflows/add-system-admin-profile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply system admin profile
        run: python3 scripts/add-system-admin-profile.py
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Commit system profile
        run: |
          rm scripts/add-system-admin-profile.py
          rm .github/workflows/add-system-admin-profile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add self-updating BURGRS system admin profile"
          git push
