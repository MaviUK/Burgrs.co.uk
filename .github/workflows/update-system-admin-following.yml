name: Update BURGRS admin creator following

on:
  push:
    paths:
      - scripts/update-system-admin-following.py
      - .github/workflows/update-system-admin-following.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply creator following update
        run: python3 scripts/update-system-admin-following.py
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Commit update
        run: |
          rm scripts/update-system-admin-following.py
          rm .github/workflows/update-system-admin-following.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make BURGRS admin follow every creator"
          git push
